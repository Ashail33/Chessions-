<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chessions Dominance Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eceff1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%228%22 fill=%22%23484cd6%22/%3E%3Crect y=%228%22 width=%2216%22 height=%228%22 fill=%22%23e8a014%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span class="name">Chessions</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-screen="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg><span>Play</span></button>
    <button type="button" data-screen="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 13h7v7h-7z"/><path class="o" d="M13 4h7v7h-7zM4 13h7v7H4z"/></svg><span>Review</span></button>
    <button type="button" data-screen="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9zM10 20V4h4v16zM16 20v-6h4v6z"/></svg><span>Insights</span></button>
    <button type="button" data-screen="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="o" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/><circle cx="12" cy="12" r="2.2"/></svg><span>Train</span></button>
  </nav>
  <button type="button" class="icon-btn" id="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.3 2.5h4l.3-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z"/></svg></button>
</header>

<main class="workspace" id="workspace">
  <section class="stage" id="stage" aria-label="Board">
    <div class="stage-head" id="stage-head"></div>
    <div class="share" id="share" aria-label="Board share">
      <div class="share-bar"><span id="share-w"></span></div>
      <div class="share-labels"><span id="share-w-label"></span><span class="share-title">Board</span><span id="share-b-label"></span></div>
    </div>
    <div id="board"></div>
    <div class="boardbar">
      <button type="button" class="icon-btn" id="nav-start" aria-label="First move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14l-9-7z"/></svg></button>
      <button type="button" class="icon-btn" id="nav-prev" aria-label="Previous move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5v14L6 12z"/></svg></button>
      <span id="nav-pos" class="mono nav-pos">Start</span>
      <button type="button" class="icon-btn" id="nav-next" aria-label="Next move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l10-7z"/></svg></button>
      <button type="button" class="icon-btn" id="nav-end" aria-label="Last move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5v14l9-7z"/></svg></button>
      <button type="button" class="icon-btn" id="flip" aria-label="Flip board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3l-4 4h3v9h2V7h3zM17 21l4-4h-3V8h-2v9h-3z"/></svg></button>
    </div>
    <div class="lens" role="radiogroup" aria-label="Board overlay" id="lens">
      <button type="button" data-overlay="control">Control</button>
      <button type="button" data-overlay="freedom">Freedom</button>
      <button type="button" data-overlay="impact">Last move</button>
      <button type="button" data-overlay="none">Off</button>
    </div>
    <p class="legend" id="legend"></p>
  </section>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="icon-btn" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
