name: android
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'vendor/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired 'tools' package, which makes sdkmanager fail.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: chessions-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
